name: Android product foundation

on:
  push:
    # These paths are not inputs to this Android build; PR checks stay unconditional.
    paths-ignore:
      - "docs/**"
      - "qualification/results/**"
      - "host/**"
      - "skills/**"
      - "README.md"
      - "AGENTS.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install existing native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config
      - name: Select Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned Gradle wrapper
        run: |
          echo '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Install selected SDK with verified command-line tools
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/cloudy-android-user
        run: |
          cloudy_tools="$RUNNER_TEMP/cloudy-command-tools"
          mkdir -p "$cloudy_tools" "$ANDROID_USER_HOME"
          curl --fail --location --retry 2 --output "$cloudy_tools/tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $cloudy_tools/tools.zip" | sha256sum --check
          unzip -q "$cloudy_tools/tools.zip" -d "$cloudy_tools"
          # Use the hosted runner's accepted SDK license records; do not pipe yes
          # to new licenses or invoke the bundled CLI's automatic update path.
          "$cloudy_tools/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;4.1.2'
      - name: Reject unreviewed SDK revision drift
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          sdk = Path(os.environ['ANDROID_HOME'])
          expected = {
              'platforms/android-37.0/source.properties': {
                  'Pkg.Revision': '2', 'AndroidVersion.ApiLevel': '37.0',
                  'AndroidVersion.ExtensionLevel': '22', 'AndroidVersion.IsBaseSdk': 'true',
              },
              'build-tools/36.0.0/source.properties': {'Pkg.Revision': '36.0.0'},
              'ndk/29.0.14206865/source.properties': {'Pkg.Revision': '29.0.14206865'},
              'cmake/4.1.2/source.properties': {'Pkg.Revision': '4.1.2'},
          }
          for relative, pins in expected.items():
              observed = dict(tuple(part.strip() for part in line.split('=', 1)) for line in (sdk / relative).read_text().splitlines()
                              if '=' in line and not line.startswith('#'))
              for key, value in pins.items():
                  if observed.get(key) != value:
                      raise SystemExit(f'SDK drift in {relative}: {key} must be {value}')
          print('SDK platform/build-tool revision pins verified')
          PY
      - name: Cache verified VNC source downloads only
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/native-rdp/downloads
            .cache/native-vnc/downloads
          key: native-vnc-downloads-${{ runner.os }}-${{ hashFiles('qualification/probes/native-rdp/source-lock.json', 'qualification/probes/native-vnc/sources.lock.json') }}
      - name: Prepare source-bound product VNC closure
        run: |
          python3 tools/build_vnc_ci.py --build --run product-ci --sdk "$ANDROID_HOME" --rdp-stage "$RUNNER_TEMP/cloudy-product-vnc-openssl"
          python3 tools/build_vnc_ci.py --check --run product-ci
          python3 tools/prepare_desktop_vnc.py --prepare --portable-run product-ci --sdk "$ANDROID_HOME"
          python3 tools/prepare_desktop_vnc.py --check --sdk "$ANDROID_HOME"
      - name: Prepare reviewed terminal source build
        run: |
          python3 tools/prepare_terminal_assets.py
          python3 tools/build_terminal_renderer.py --fetch-compiler
          python3 tools/prepare_terminal_assets.py --fetch-search
          python3 tools/prepare_terminal_assets.py --product --offline
          python3 tools/prepare_terminal_assets.py --product --check
      - name: Verify generated Compose design tokens are current
        run: python3 tools/generate_android_tokens.py --check
      - name: Compile, lint, and test all foundation modules
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/cloudy-gradle-home
          ANDROID_USER_HOME: ${{ runner.temp }}/cloudy-android-user
        run: |
          mkdir -p "$GRADLE_USER_HOME" "$ANDROID_USER_HOME"
          set +e
          ./gradlew :console:assembleDebug :desktop:assembleDebug \
            :vnc:assembleDebug :vnc:assembleRelease :vnc:lintDebug :vnc:lintRelease \
            :console:lintDebug :desktop:lintDebug \
            :domain:test :ssh:test :platform:testDebugUnitTest :design-system:testDebugUnitTest \
            :desktop:testDebugUnitTest :vnc:testDebugUnitTest \
            :terminal:testDebugUnitTest :terminal:lintDebug \
            :identity:testDebugUnitTest :identity:lintDebug :identity:assembleDebugAndroidTest \
            :platform:assembleDebugAndroidTest :console:assembleDebugAndroidTest :desktop:assembleDebugAndroidTest \
            --dependency-verification=strict --no-daemon --console=plain --max-workers=4 \
            2>&1 | tee "$RUNNER_TEMP/cloudy-foundation-build.log"
          cloudy_build_status=${PIPESTATUS[0]}
          set -e
          if [ "$cloudy_build_status" -ne 0 ]; then
            # Public bounded diagnostics preserve failure visibility when full job
            # log downloads require authentication. This build has no secrets.
            python3 - <<'PYTHON' || echo '::warning::Unable to annotate the build log; retaining original Gradle status.'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'cloudy-foundation-build.log').read_text(errors='replace')[-12000:]
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Product foundation Gradle failure::{escaped}')
          PYTHON
          fi
          exit "$cloudy_build_status"
      - name: Verify debug APK signatures
        run: |
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify --verbose --print-certs apps/console/build/outputs/apk/debug/console-debug.apk
          "$apksigner" verify --verbose --print-certs apps/desktop/build/outputs/apk/debug/desktop-debug.apk
      # Hosted CI has no Googlebook. Compilation and lint here are never device
      # proof; connected androidTest execution is recorded separately on the actual device.
