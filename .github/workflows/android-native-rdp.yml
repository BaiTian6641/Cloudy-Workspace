name: Android native RDP diagnostic

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set isolated build directories on the runner
        run: |
          echo "RDP_STAGE=$RUNNER_TEMP/cloudy-native-rdp" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/cloudy-native-rdp-gradle" >> "$GITHUB_ENV"
      - name: Select Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned Gradle wrapper
        working-directory: qualification/probes/device-baseline
        run: |
          echo '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Install selected SDK with verified command-line tools
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/cloudy-android-user
        run: |
          cloudy_tools="$RUNNER_TEMP/cloudy-command-tools"
          mkdir -p "$cloudy_tools" "$ANDROID_USER_HOME"
          curl --fail --location --retry 2 --output "$cloudy_tools/tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $cloudy_tools/tools.zip" | sha256sum --check
          unzip -q "$cloudy_tools/tools.zip" -d "$cloudy_tools"
          # Use the hosted runner's accepted SDK license records; do not pipe yes
          # to new licenses or invoke the bundled CLI's automatic update path.
          "$cloudy_tools/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;4.1.2'
      - name: Reject unreviewed SDK revision drift
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          sdk = Path(os.environ['ANDROID_HOME'])
          expected = {
              'platforms/android-37.0/source.properties': {
                  'Pkg.Revision': '2', 'AndroidVersion.ApiLevel': '37.0',
                  'AndroidVersion.ExtensionLevel': '22', 'AndroidVersion.IsBaseSdk': 'true',
              },
              'build-tools/36.0.0/source.properties': {'Pkg.Revision': '36.0.0'},
              'ndk/29.0.14206865/source.properties': {'Pkg.Revision': '29.0.14206865'},
              'cmake/4.1.2/source.properties': {'Pkg.Revision': '4.1.2'},
          }
          for relative, pins in expected.items():
              observed = dict(tuple(part.strip() for part in line.split('=', 1))
                              for line in (sdk / relative).read_text().splitlines()
                              if '=' in line and not line.startswith('#'))
              for key, value in pins.items():
                  if observed.get(key) != value:
                      raise SystemExit(f'SDK drift in {relative}: {key} must be {value}')
          print('SDK platform/build-tool revision pins verified')
          PY
      - name: Cache verified source downloads only
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/native-rdp/downloads
          key: native-rdp-downloads-${{ runner.os }}-${{ hashFiles('qualification/probes/native-rdp/source-lock.json') }}
      - name: Acquire, verify and configure the real native target
        run: |
          python3 tools/setup_rdp_native.py --sdk "$ANDROID_HOME" --stage "$RDP_STAGE"
      - name: Build actual native libraries and issue the receipt
        run: |
          cloudy_rev=97eff6ddfbbfaa8e42a126d362686bd001ff8bdc
          python3 tools/build_rdp_native.py \
            --source "$RDP_STAGE/FreeRDP-$cloudy_rev" --build "$RDP_STAGE/build" \
            --archive ".cache/native-rdp/downloads/FreeRDP-$cloudy_rev.tar.gz" \
            --receipt .cache/native-rdp/ci-receipt.json
      - name: Import verified native libraries and corresponding source
        run: |
          cloudy_rev=97eff6ddfbbfaa8e42a126d362686bd001ff8bdc
          python3 tools/prepare_rdp_native.py \
            --source "$RDP_STAGE/FreeRDP-$cloudy_rev" --build "$RDP_STAGE/build" \
            --archive ".cache/native-rdp/downloads/FreeRDP-$cloudy_rev.tar.gz" \
            --mpl-license qualification/probes/native-rdp/licenses/MPL-2.0.txt \
            --receipt .cache/native-rdp/ci-receipt.json
          python3 tools/prepare_rdp_native.py --check
      - name: Compile, lint and test the real native diagnostic APK
        run: |
          ./qualification/probes/device-baseline/gradlew -p qualification/probes/native-rdp \
            :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --no-daemon --console=plain
      - name: Retain bounded build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-rdp-build-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/cloudy-native-rdp/configure.log
            .cache/native-rdp/ci-receipt.json
            .cache/native-rdp/ci-receipt.log
            qualification/probes/native-rdp/app/build/reports/tests/
            qualification/probes/native-rdp/app/build/test-results/
            qualification/probes/native-rdp/app/build/reports/lint-results-debug.*
      # No Googlebook/server exists here. CI does not qualify JNI runtime loading,
      # native queue execution, authentication, pixels, input or cleanup on device.
