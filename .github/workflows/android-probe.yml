name: Android qualification probe

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Select Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned Gradle wrapper
        working-directory: qualification/probes/device-baseline
        run: |
          echo '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Install selected SDK with verified command-line tools
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/cloudy-android-user
        run: |
          cloudy_tools="$RUNNER_TEMP/cloudy-command-tools"
          mkdir -p "$cloudy_tools" "$ANDROID_USER_HOME"
          curl --fail --location --retry 2 --output "$cloudy_tools/tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $cloudy_tools/tools.zip" | sha256sum --check
          unzip -q "$cloudy_tools/tools.zip" -d "$cloudy_tools"
          # Use the hosted runner's accepted SDK license records; do not pipe yes
          # to new licenses or invoke the bundled CLI's automatic update path.
          "$cloudy_tools/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Reject unreviewed SDK revision drift
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          sdk = Path(os.environ['ANDROID_HOME'])
          expected = {
              'platforms/android-37.0/source.properties': {
                  'Pkg.Revision': '2', 'AndroidVersion.ApiLevel': '37.0',
                  'AndroidVersion.ExtensionLevel': '22', 'AndroidVersion.IsBaseSdk': 'true',
              },
              'build-tools/36.0.0/source.properties': {'Pkg.Revision': '36.0.0'},
          }
          for relative, pins in expected.items():
              observed = dict(line.split('=', 1) for line in (sdk / relative).read_text().splitlines()
                              if '=' in line and not line.startswith('#'))
              for key, value in pins.items():
                  if observed.get(key) != value:
                      raise SystemExit(f'SDK drift in {relative}: {key} must be {value}')
          print('SDK platform/build-tool revision pins verified')
          PY
      - name: Prepare integrity-pinned terminal assets
        run: python3 tools/prepare_terminal_assets.py
      - name: Compile, lint, and test the real probe
        working-directory: qualification/probes/device-baseline
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --no-daemon --console=plain
      # Hosted CI has no Googlebook. A successful build is never device proof.
