name: Host core diagnostic

on:
  push:
    paths: ['host/core/**', '.github/workflows/host-core.yml']
  pull_request:
    paths: ['host/core/**', '.github/workflows/host-core.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: host/core
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOPROXY: 'off'
      GOTELEMETRY: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check selected compiler and formatting
        run: |
          compiler=$(go env GOVERSION)
          printf 'Selected compiler: %s\n' "$compiler"
          test "$compiler" = 'go1.27.2'
          # Keep formatter failures observable, including a failed invocation.
          formatting=$(gofmt -l .)
          if [ -n "$formatting" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$formatting"
            exit 1
          fi
      - name: Download the exact reviewed Windows API module
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GONOSUMDB: ''
          GOPRIVATE: ''
        run: |
          # Only this step has module-network access. Committed checksums and the
          # public checksum database bind the selected upstream implementation.
          go mod download golang.org/x/sys@v0.49.0
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Compile, vet and execute contract tests
        run: |
          go vet -mod=readonly ./...
          # Print per-case skips so an unsupported platform operation is visible.
          go test -v -mod=readonly ./...
          go build -mod=readonly -trimpath -buildvcs=false ./cmd/cloudy-host
      - name: Race checks on Linux
        if: runner.os == 'Linux'
        run: go test -race -mod=readonly ./...
      # These are real hosted CLI executions, not desktop-session qualification.
      - name: Execute the local diagnostic
        run: |
          test "$(go run -mod=readonly ./cmd/cloudy-host version)" = '0.1.2'
          go run -mod=readonly ./cmd/cloudy-host inspect
